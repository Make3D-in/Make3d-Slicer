<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make3D Cloud Account</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body class="dark">
    <div class="auth-container">
        <!-- Brand Header -->
        <div class="auth-header">
            <img src="../image/make3d_brand_logo.png" alt="Make3D Logo" class="auth-logo"
                 onerror="this.style.display='none'">
            <h2 class="auth-title">Make3D Cloud</h2>
            <p class="auth-subtitle">Sign in to sync your presets &amp; profiles across all devices.</p>
        </div>

        <!-- Alert Banner -->
        <div id="alert-banner" class="alert-banner" style="display:none;"></div>

        <!-- Tab Nav (only when logged out) -->
        <div id="tab-nav" class="tab-nav">
            <button id="tab-login-btn" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button id="tab-register-btn" class="tab-btn" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="name@company.com" autocomplete="username">
            </div>
            <div class="input-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="Enter your password" autocomplete="current-password">
            </div>
            <div class="form-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember-me" checked>
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot password?</a>
            </div>
            <button type="submit" id="btn-login-submit" class="btn-primary">Sign In</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
            <div class="input-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" required placeholder="name@company.com" autocomplete="username">
            </div>
            <div class="input-group">
                <label for="reg-password">Create Password</label>
                <input type="password" id="reg-password" required placeholder="Minimum 6 characters" autocomplete="new-password" minlength="6">
            </div>
            <div class="input-group">
                <label for="reg-password-confirm">Confirm Password</label>
                <input type="password" id="reg-password-confirm" required placeholder="Repeat your password" autocomplete="new-password" minlength="6">
            </div>
            <button type="submit" id="btn-register-submit" class="btn-primary">Create Make3D Account</button>
        </form>

        <!-- ACCOUNT DASHBOARD (logged in) -->
        <div id="account-dashboard" class="auth-form dashboard-form" style="display:none;">
            <!-- User info -->
            <div class="user-card-dash">
                <div class="user-avatar-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="user-card-info">
                    <div id="user-email-display" class="user-email-text">user@example.com</div>
                    <div class="sync-status-row">
                        <span id="sync-status-dot" class="status-dot online"></span>
                        <span id="sync-status-text">Make3D Cloud Connected</span>
                    </div>
                </div>
            </div>

            <!-- Preset stats -->
            <div class="stats-card">
                <div class="stat-item">
                    <span class="stat-value" id="synced-preset-count">—</span>
                    <span class="stat-label">Cloud Presets</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-value" id="last-sync-time">—</span>
                    <span class="stat-label">Last Sync</span>
                </div>
            </div>

            <!-- Sync buttons -->
            <div class="sync-actions">
                <button type="button" id="btn-sync-down" class="btn-primary" onclick="syncPresetsDown()">
                    ↓ Download Presets
                </button>
                <button type="button" id="btn-continue-slicer" class="btn-primary" style="margin-top:10px;background:linear-gradient(135deg,#00a8ff,#0066cc);" onclick="continueToSlicer()">
                    ✓ Continue to Slicer
                </button>
                <button type="button" id="btn-sync-up" class="btn-sync-up" onclick="syncPresetsUp()">
                    ↑ Upload Presets
                </button>
            </div>

            
        </div>

        <!-- Footer -->
        <div class="auth-footer">Make3D Slicer Cloud Services</div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
